name: Python wheels

# The wheels of the Python binding (packages/engine-rs/crates/cslope-py,
# ARCHITECTURE.md §8.5): built on a tag py-v* (e.g. py-v0.1.0) or by hand,
# never on ordinary pushes, so the other workflows are not affected. One
# abi3 wheel per platform serves CPython 3.9 and later; each is installed
# and smoke-tested (tests/test_api.py) on the oldest and a recent Python.
on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CRATE: packages/engine-rs/crates/cslope-py

jobs:
  build:
    name: Wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { name: macos-universal2, os: macos-latest, target: universal2-apple-darwin, manylinux: "" }
          - { name: windows-x64, os: windows-latest, target: x64, manylinux: "" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Rust as pinned in packages/engine-rs/rust-toolchain.toml
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ env.CRATE }}
          maturin-version: "1.15.0"
          rust-toolchain: "1.97.0"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist
          # (the Linux builds run in a manylinux container: pass the commit in)
          docker-options: -e CSLOPE_ENGINE_COMMIT
        env:
          # ENGINE_BUILD = version + this commit (the container may not run git)
          CSLOPE_ENGINE_COMMIT: ${{ github.sha }}
      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: ${{ env.CRATE }}/dist/*.whl
          if-no-files-found: error

  smoke:
    name: Test ${{ matrix.name }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x86_64, linux-aarch64, macos-universal2, windows-x64]
        python: ["3.9", "3.13"]
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-universal2, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
    steps:
      # Only the tests are needed from the repository; the package comes from the wheel.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ env.CRATE }}/tests
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: dist/*.whl pytest numpy
      # From outside the crate, so that the installed package is imported
      - name: Smoke test
        shell: bash
        working-directory: dist
        run: python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/$CRATE/tests"

  # Publishing to PyPI is disabled: no trusted publisher is configured for
  # this repository yet. To enable it: add the project on PyPI with this
  # workflow as a trusted publisher (environment "pypi"), then remove the
  # `if: false` below. No secrets are needed (OIDC, id-token: write).
  publish:
    name: Publish to PyPI
    if: false
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        with:
          packages-dir: dist
