name: Full verification

# The test suite runs the circular verification problems with a shorter
# search (1000 + 1000 trial surfaces). Once a week, and on demand, they run
# with the full search used for the published report and table, so that an
# engine change after which the shorter search misses the minimum is caught.
# The same run does what ci.yml leaves out of pull requests to keep them
# short: the dependency audits, the byte-for-byte rebuild of the committed
# WebAssembly engine, and the desktop app's whole test suite on Windows.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      # The engine's tests run on its testing build (packages/engine/vitest.setup.ts)
      - name: Setup Rust
        working-directory: packages/engine-rs
        run: rustup toolchain install
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: wasm-bindgen-cli@0.2.130
      - name: Build the testing engine
        run: bun packages/engine-rs/tools/build-wasm.ts testing
      - name: Verification problems, full search
        working-directory: packages/engine
        env:
          CSLOPE_VERIFICATION_FULL: "1"
        run: bunx vitest run src/model/verification-problems

  # The dependency advisories (not checked on pull requests). A high or
  # critical advisory on a production dependency fails the job (the root
  # package.json's audit script), and so does a crate with a RustSec
  # advisory. No advisory is ignored: when one appears, upgrade the
  # dependency (Dependabot opens the pull request) and add an --ignore only
  # for an advisory reviewed as not reachable, with the reason here.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      - name: Audit dependencies
        run: bun run audit
      - name: Setup Rust
        working-directory: packages/engine-rs
        run: rustup toolchain install
      - name: Install cargo-audit
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit
      - name: Audit crates
        working-directory: packages/engine-rs
        run: cargo audit

  # The committed WebAssembly builds (the wasm, the glue and BUILD-INFO.json)
  # are reproduced byte for byte: the build remaps machine paths, leaves the
  # producers section out, and the same wasm-bindgen CLI runs on both sides
  # (tools/build-wasm.ts). A difference fails the job and uploads this
  # build, to compare or to commit.
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      - name: Setup Rust
        working-directory: packages/engine-rs
        run: rustup toolchain install
      # The CLI of the version in Cargo.lock (build-wasm.ts fails if they
      # differ), built from its own lockfile like the developer's (--locked),
      # so that it transforms the engine exactly as the developer's did and
      # the bytes can be compared.
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked --force
      - name: Build WebAssembly
        run: |
          bun packages/engine-rs/tools/build-wasm.ts product
          bun packages/engine-rs/tools/build-wasm.ts project
      - name: Committed build matches the rebuild
        id: compare
        run: git diff --exit-code --stat -- packages/engine/src/wasm packages/engine/src/wasm-project
      - name: Show the difference
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          git show HEAD:packages/engine/src/wasm/cslope_wasm_bg.wasm > committed.wasm
          echo "$(cmp -l packages/engine/src/wasm/cslope_wasm_bg.wasm committed.wasm | wc -l) bytes differ; the first:"
          cmp -l packages/engine/src/wasm/cslope_wasm_bg.wasm committed.wasm | head -20
          git diff -- packages/engine/src/wasm/BUILD-INFO.json packages/engine/src/wasm-project/BUILD-INFO.json
      - name: Upload the rebuild
        if: failure() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-wasm-rebuild
          path: |
            packages/engine/src/wasm
            packages/engine/src/wasm-project

  # The desktop app's whole test suite on Windows, where it ships (pull
  # requests run its quick set on Linux).
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      - name: Test
        run: bun run --filter @cslope/desktop test
