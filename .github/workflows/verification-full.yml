name: Full verification

# The test suite runs the circular verification problems with a shorter
# search (1000 + 1000 trial surfaces). Once a week, and on demand, they run
# with the full search used for the published report and table, so that an
# engine change after which the shorter search misses the minimum is caught.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      # The engine's tests run on its testing build (packages/engine/vitest.setup.ts)
      - name: Setup Rust
        working-directory: packages/engine-rs
        run: rustup toolchain install
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - name: Build the testing engine
        run: bun packages/engine-rs/tools/build-wasm.ts testing
      - name: Verification problems, full search
        working-directory: packages/engine
        env:
          CSLOPE_VERIFICATION_FULL: "1"
        run: bunx vitest run src/model/verification-problems

  # The dependency advisories, also in a week without a push: the JavaScript
  # packages as ci.yml's check job audits them on every push, and the Rust
  # crates as its rust job does when the engine changes.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      - name: Audit dependencies
        run: bun run audit
      - name: Setup Rust
        working-directory: packages/engine-rs
        run: rustup toolchain install
      - name: Install cargo-audit
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      - name: Audit crates
        working-directory: packages/engine-rs
        run: cargo audit
