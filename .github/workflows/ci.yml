name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      # Fails when coverage drops below the thresholds in vitest.config.ts.
      - name: Test with coverage
        run: bun run test:coverage
