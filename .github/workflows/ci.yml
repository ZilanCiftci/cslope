name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The three jobs run in parallel. The engine is platform-independent
# TypeScript and runs on the faster Linux runner; the desktop app (Electron
# main process, file paths) is tested on Windows, where it ships.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      # The repository is public: no other program is named in any file.
      - name: Check names
        run: bun packages/website/scripts/check-names.ts --repo
      - name: Test website
        run: bun run --filter @cslope/website test
      # Also fails when another product is named on the site.
      - name: Build website
        run: bun run --filter @cslope/website build

  # Coverage runs on pull requests and on main only, where it is checked
  # against the thresholds in each package's vitest.config.ts. Other pushes
  # run the same tests without coverage, which is faster.
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test with coverage
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: bun run --filter @cslope/engine test:coverage
      - name: Test
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: bun run --filter @cslope/engine test

  desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test with coverage
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: bun run --filter @cslope/desktop test:coverage
      - name: Test
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: bun run --filter @cslope/desktop test
