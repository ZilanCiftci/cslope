name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Kept lean (the engine port to Rust is done and verified):
# - The engine jobs (rust, engine) run only when the engine changed
#   (packages/engine-rs, packages/engine); the app's own changes do not
#   rebuild or retest the engine. The weekly verification-full workflow
#   runs everything on a schedule.
# - The engine's verification checks run once, in Rust, against the golden
#   results (golden/verification.json); the TypeScript test suite runs its
#   quick set (the API over the engine), not the verification problems again.
# - No coverage runs (it measured thin wrappers and slowed the jobs).
# - Pushes to working branches test the desktop app on Linux; main and pull
#   requests on Windows, where it ships. The desktop leaves out the full
#   engine searches on working branches (CSLOPE_QUICK_TESTS).
env:
  CSLOPE_QUICK_TESTS: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && '1' || '' }}

# Time limits: each job stops a few times its usual run time (check about
# 1 min, desktop 6, engine 2, rust 11 and python 5 with their cache), and
# Install after 5 min, so a hung step fails within minutes instead of
# GitHub's 6 hours.
jobs:
  # Which parts changed: the engine jobs are skipped when the engine did not.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            engine:
              - 'packages/engine-rs/**'
              - 'packages/engine/**'
              - 'rust-toolchain.toml'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            # The Python package is in packages/engine-rs (crates/cslope-py);
            # its tests also run the skill's examples, the app's project
            # fixtures and the web templates' fixture documents.
            python:
              - 'packages/engine-rs/**'
              - 'skills/**'
              - 'packages/desktop/src/features/project/fixtures/**'
              - 'packages/web/src/templates/fixtures/**'
              - '.github/workflows/ci.yml'

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      # A high or critical advisory on a production dependency fails the
      # job (the root package.json's audit script). No advisory is ignored:
      # when one appears, upgrade the dependency (Dependabot opens the pull
      # request) and add an --ignore only for an advisory reviewed as not
      # reachable, with the reason here. The weekly verification-full
      # workflow audits the Rust crates too.
      - name: Audit dependencies
        run: bun run audit
      # The committed WebAssembly engine was built from the Rust sources as
      # they are (BUILD-INFO.json; no Rust needed). The rust job reproduces
      # it byte for byte when the engine changes.
      - name: Engine build is fresh
        run: |
          bun packages/engine-rs/tools/check-wasm-fresh.ts
          bun packages/engine-rs/tools/check-wasm-fresh.ts project
      # The golden corpus of the model conversion (crates/cslope-project)
      # is made by the app's code: a change to the app's conversion or load
      # (store/helpers.ts, definition-model.ts, persistence.ts, ...) must
      # regenerate it, and the rust job then holds the Rust port to it.
      - name: Project corpus is fresh
        run: |
          bun packages/desktop/scripts/project-corpus.ts
          git diff --exit-code -- packages/engine-rs/golden/project-corpus.json
      # The .cslp format and project schema versions are the same in the app
      # and in the Rust reader and writer (cslope-project, the Python
      # package's); a change to one without the other fails here.
      - name: Project format versions match
        run: bun packages/engine-rs/tools/check-format-versions.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      # The repository is public: no other program is named in any file.
      - name: Check names
        run: bun packages/website/scripts/check-names.ts --repo
      - name: Test website
        run: bun run --filter @cslope/website test
      # Also fails when another product is named on the site.
      - name: Build website
        run: bun run --filter @cslope/website build
      # The built site served as Vercel serves it (vercel.json's headers and
      # rewrites), every page in Chromium in both themes: fails on a console
      # error, a failed request or an accessibility violation (axe-core).
      - name: Smoke test website
        working-directory: packages/website
        run: |
          bunx playwright install --with-deps --only-shell chromium
          bun run smoke
      # ── The browser app (packages/web, #87) ─────────────────────────────
      # Its tests, its build (with the name and content-security-policy
      # checks) and the smoke test: the built page in Chromium in both
      # themes, with T-ACADS Simple run through the engine's worker under
      # the policy of its vercel.json (F 0.984).
      - name: Test web
        run: bun run --filter @cslope/web test
      - name: Build web
        run: bun run --filter @cslope/web build
      - name: Smoke test web
        working-directory: packages/web
        run: bun run smoke
      # ── End of the browser app ──────────────────────────────────────────

  # The engine's TypeScript API over the testing build of the WebAssembly
  # engine (internal functions the tests call): the quick set.
  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CSLOPE_QUICK_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      - name: Setup Rust
        working-directory: packages/engine-rs
        run: rustup toolchain install
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/engine-rs
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: wasm-bindgen-cli@0.2.130
      - name: Build the testing engine
        run: bun packages/engine-rs/tools/build-wasm.ts testing
      - name: Test
        run: bun run --filter @cslope/engine test

  desktop:
    runs-on: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      - name: Test
        run: bun run --filter @cslope/desktop test

  # The Rust engine (packages/engine-rs): format, lints, tests including the
  # verification checks against the golden results, and the WebAssembly build
  # (its generated glue must match the committed one; size budget).
  rust:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      # The toolchain of rust-toolchain.toml, with the wasm32 target
      - name: Setup Rust
        working-directory: packages/engine-rs
        run: rustup toolchain install
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/engine-rs
      # The CLI of the version in Cargo.lock (build-wasm.ts fails if they
      # differ), built from its own lockfile like the developer's (--locked),
      # so that it transforms the engine exactly as the developer's did and
      # the bytes can be compared; rust-cache keeps the binary between runs.
      - name: Install wasm-bindgen
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q ' 0\.2\.130$'; then
            cargo install wasm-bindgen-cli --version 0.2.130 --locked --force
          fi
      - name: Install cargo-audit
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit
      - name: Format
        working-directory: packages/engine-rs
        run: cargo fmt --check
      - name: Lint
        working-directory: packages/engine-rs
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy -p cslope-wasm --target wasm32-unknown-unknown --all-features -- -D warnings
          cargo clippy -p cslope-project-wasm --target wasm32-unknown-unknown -- -D warnings
      # Unit tests, and the verification checks with the golden results
      # (golden/verification.json, tests/verification_native.rs)
      - name: Test
        working-directory: packages/engine-rs
        run: cargo test --release --all-features
      # The JSON schemas (packages/engine/schema) and the Python TypedDicts
      # generated from them (cslope-py's __init__.pyi) match the engine's
      # types, as the committed WebAssembly build matches its sources.
      - name: Schemas are fresh
        run: bun packages/engine-rs/tools/schema.ts --check
      # Crates with a RustSec advisory fail the job (the weekly
      # verification-full workflow runs this too).
      - name: Audit crates
        working-directory: packages/engine-rs
        run: cargo audit
      - name: Build WebAssembly
        run: |
          bun packages/engine-rs/tools/build-wasm.ts product
          bun packages/engine-rs/tools/build-wasm.ts project
      # The committed build (the wasm, the glue and BUILD-INFO.json) is
      # reproduced byte for byte: the build remaps machine paths, leaves the
      # producers section out, and the same wasm-bindgen CLI runs on both
      # sides (tools/build-wasm.ts). A difference fails the job and uploads
      # this build, to compare or to commit.
      - name: Committed build matches the rebuild
        id: compare
        run: git diff --exit-code --stat -- packages/engine/src/wasm packages/engine/src/wasm-project
      - name: Show the difference
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          git show HEAD:packages/engine/src/wasm/cslope_wasm_bg.wasm > committed.wasm
          echo "$(cmp -l packages/engine/src/wasm/cslope_wasm_bg.wasm committed.wasm | wc -l) bytes differ; the first:"
          cmp -l packages/engine/src/wasm/cslope_wasm_bg.wasm committed.wasm | head -20
          git diff -- packages/engine/src/wasm/BUILD-INFO.json packages/engine/src/wasm-project/BUILD-INFO.json
      - name: Upload the rebuild
        if: failure() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-wasm-rebuild
          path: |
            packages/engine/src/wasm
            packages/engine/src/wasm-project
      # The size budget of the product build (ARCHITECTURE.md §3.5)
      - name: Size budget
        run: test "$(stat -c %s packages/engine/src/wasm/cslope_wasm_bg.wasm)" -le 4194304

  # The Python package (packages/engine-rs/crates/cslope-py): built in place
  # with maturin and its tests run (the API, the builder, the command, export,
  # the skill's examples and the web templates' fixtures against their pinned
  # F). The wheels workflow (python.yml) builds and tests the wheels only on
  # a py-v* tag. Not a required check yet (#86).
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRATE: packages/engine-rs/crates/cslope-py
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The toolchain of rust-toolchain.toml
      - name: Setup Rust
        working-directory: packages/engine-rs
        run: rustup toolchain install
      # Its own cache key: the release build of the binding is not the rust
      # job's (other features and crates).
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/engine-rs
          key: python
      # maturin as pinned in pyproject.toml and the wheels workflow; numpy
      # for the tests of the arrays as numpy arrays.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install maturin==1.15.0 pytest numpy
        timeout-minutes: 5
      - name: Build
        working-directory: ${{ env.CRATE }}
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: ../../../../.venv/bin/maturin develop --release
      - name: Test
        working-directory: ${{ env.CRATE }}
        run: ../../../../.venv/bin/python -m pytest -q -p no:cacheprovider
