name: Release

# Push a tag such as v0.1.0 (it must match packages/desktop/package.json) to
# build the Windows installer and publish a GitHub release with it, its
# SHA-256 checksum, the public verification report and the notes from
# CHANGELOG.md. Tag a commit on main
# whose CI run is green: the tests are not run again here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release at a time per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Optional: a Vercel deploy hook, to rebuild the website after a release.
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check the tag against the app version
        shell: pwsh
        run: |
          # Stop at the first failing command, as bash does.
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content packages/desktop/package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the app version $version"
          }
      - name: Set up Azure Trusted Signing
        # sign.cjs signs with signtool and Microsoft's signing dlib, which
        # reads the account from a metadata file and logs in with the
        # AZURE_CLIENT_* secrets (an app registration with the role
        # "Trusted Signing Certificate Profile Signer").
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in "AZURE_SIGNING_ENDPOINT", "AZURE_SIGNING_ACCOUNT", "AZURE_SIGNING_PROFILE") {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) { throw "Repository secret $name is not set" }
          }
          $dir = "$env:RUNNER_TEMP\trusted-signing"
          # The client was renamed with the service (Trusted Signing is now Artifact Signing);
          # the old package is unlisted. Pinned, so a release builds the same way.
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.128 -OutputDirectory $dir -ExcludeVersion -NonInteractive
          $dlib = "$dir\Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { throw "Signing dlib not found at $dlib" }
          $metadata = "$dir\metadata.json"
          @{
            Endpoint               = $env:AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_SIGNING_PROFILE
          } | ConvertTo-Json | Out-File -Encoding utf8 $metadata
          # The newest x64 signtool of the installed Windows SDKs.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          "AZURE_CODE_SIGNING_DLIB=$dlib" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AZURE_METADATA_JSON=$metadata" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build the installer
        working-directory: packages/desktop
        # Signed with Azure Trusted Signing (sign.cjs): without the
        # credentials the build fails rather than ship an unsigned installer.
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        # The app bundle must not carry other programs' names (the
        # verification data, which cites them, is not part of it). Bash
        # stops at the first failing command; pwsh would carry on.
        shell: bash
        run: |
          bunx tsc -b
          bunx vite build
          bun ../website/scripts/check-names.ts dist dist-electron
          bunx electron-builder --win --publish never
      - name: Check the signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content packages/desktop/package.json | ConvertFrom-Json).version
          $installer = "packages/desktop/release/$version/cSlope-Windows-$version-Setup.exe"
          $sig = Get-AuthenticodeSignature $installer
          if ($sig.Status -ne "Valid") { throw "Installer signature: $($sig.Status) $($sig.StatusMessage)" }
          "Signed by $($sig.SignerCertificate.Subject)"
      - name: Checksum and release notes
        shell: pwsh
        run: |
          # Stop at the first failing command, as bash does.
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content packages/desktop/package.json | ConvertFrom-Json).version
          $installer = "packages/desktop/release/$version/cSlope-Windows-$version-Setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  cSlope-Windows-$version-Setup.exe" | Out-File -Encoding ascii "$installer.sha256"
          bun packages/website/scripts/changelog.ts $version release-notes.md --release
          bun packages/website/scripts/check-names.ts release-notes.md
          "INSTALLER=$installer" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Verification report
        working-directory: packages/desktop
        # The public edition, attached to the release and linked from the
        # website's verification page. Every string it writes passes the
        # forbidden-names guard, so a name stops the release here.
        run: bun scripts/verification-report.ts ../../cSlope-verification-report.pdf --public
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: cSlope ${{ github.ref_name }}
          body_path: release-notes.md
          # A tag with a suffix (v0.2.0-rc.1) is a pre-release: it is not
          # "latest", so the website's download links keep the last release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            ${{ env.INSTALLER }}
            ${{ env.INSTALLER }}.sha256
            cSlope-verification-report.pdf
      - name: Rebuild the website
        # The site links to the latest release's installer and report, found
        # when it is built (packages/website/scripts/latest-release.ts), so it
        # is rebuilt once the release is out. Needs the repository secret
        # VERCEL_DEPLOY_HOOK (a deploy hook URL from the Vercel project).
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' && !contains(github.ref_name, '-') }}
        shell: bash
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
