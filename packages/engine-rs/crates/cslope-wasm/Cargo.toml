[package]
name = "cslope-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly API of the cSlope engine (wasm-bindgen), used by the TypeScript facade in packages/engine"
publish = false

[lib]
# cdylib for wasm-bindgen; rlib so that the target-independent parts (the
# handle registry, the testing dispatch table) are tested natively.
crate-type = ["cdylib", "rlib"]

[features]
# The testing build (packages/engine/src/wasm-testing): adds `__test_call`,
# which dispatches the internal functions the TypeScript unit tests import,
# and the app model conversion (cslope-project, issue #57) until the app
# uses it: the product build does not carry it.
testing = ["dep:cslope-project"]

[dependencies]
cslope-engine = { path = "../cslope-engine" }
# (without `native`: no ZIP code in WebAssembly)
cslope-project = { path = "../cslope-project", optional = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
