[package]
name = "cslope-project"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cSlope project models: the app's model of a .cslp file and its conversion to and from the engine's slope definition"
publish = false

[features]
# Writing a `.cslp` archive in memory (the ZIP container, `archive`): the
# pure-Rust ZIP writer and deflate, no file I/O. The WebAssembly build
# (cslope-wasm) takes this one, for the browser's project download (#107).
write = ["dep:zip", "dep:flate2"]
# Also reading `.cslp` archives and saving them atomically to a file (the
# Python binding).
native = ["write"]

[dependencies]
cslope-engine = { path = "../cslope-engine" }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
# The input hash of a result (SHA-256, docs/file-format.md section 5).
sha2 = "=0.11.1"
# Numbers as JavaScript's `Number.prototype.toString` writes them (the
# canonical JSON of section 2; the engine's `js::num::to_string` breaks an
# exact tie of the shortest digits the other way, e.g. 2^-25).
ryu-js = "=1.0.3"
# The ZIP container (features `write` and `native`): the deflate of
# flate2's pure Rust backend (miniz_oxide) only, no other compression, no
# encryption, no time crate (the time stamp is the manifest's).
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2"], optional = true }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"], optional = true }

# flate2 is not used in the code: it is named to pick its pure Rust backend
# for zip's deflate.
[package.metadata.cargo-machete]
ignored = ["flate2"]

[lints]
workspace = true
