[package]
name = "cslope-project-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly writer of cSlope projects (.cslp), loaded by the browser page on demand (issue #107)"
publish = false

# A second WebAssembly module, apart from the engine (cslope-wasm): the
# app's model of a definition and the `.cslp` writer would add about 2.4 MB
# to the engine, above its 4 MB budget (ARCHITECTURE.md §3.5), for a
# command few users of the page take. The page loads this module only when
# a project is downloaded (packages/engine/src/project.ts).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cslope-engine = { path = "../cslope-engine" }
# The app's model and the `.cslp` writer in memory (`write`): the pure-Rust
# ZIP writer and deflate (miniz_oxide); without `native` (no ZIP reader,
# no files).
cslope-project = { path = "../cslope-project", default-features = false, features = ["write"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true

[lints]
workspace = true
