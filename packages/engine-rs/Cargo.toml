[workspace]
resolver = "2"
members = [
    "crates/cslope-engine",
    "crates/cslope-project",
    "crates/cslope-wasm",
    "crates/cslope-py",
]
# The Python binding needs a Python interpreter to build (pyo3) and is built
# by maturin (crates/cslope-py, .github/workflows/python.yml): plain `cargo
# build/clippy/test` in this directory leave it out; `--workspace` or
# `-p cslope-py` take it.
default-members = [
    "crates/cslope-engine",
    "crates/cslope-project",
    "crates/cslope-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Exact pins: the wasm-bindgen CLI that generates the JavaScript glue must be
# the same version as the crate (tools/build-wasm.ts checks it against
# Cargo.lock). Install it with
#   cargo install wasm-bindgen-cli --version 0.2.130 --locked
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
serde-wasm-bindgen = "=0.6.5"
# The JSON schemas of the input and the result (types/schema.rs, issue #55):
# derived from the serde types; 1.x reads `rename_all_fields`.
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
# Strict validation of a definition (types/validate_definition.rs): the
# paths of keys the engine ignores and of values it cannot read.
serde_ignored = "=0.1.14"
serde_path_to_error = "=0.1.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The WebAssembly build (tools/build-wasm.ts): release, with panics that
# abort (the instance traps; the facade reports it) and no symbols.
[profile.wasm-release]
inherits = "release"
panic = "abort"
strip = "debuginfo"

[profile.test]
opt-level = 2
