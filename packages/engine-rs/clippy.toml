# JavaScript semantics that change logic, not just the last bits
# (ARCHITECTURE.md §5): use crate::js instead.
#
# Transcendental functions (sin, cos, atan2, exp, powf, hypot, …) go through
# js::math, which calls the pure Rust libm crate: std's methods call the
# platform's C library natively, which rounds differently on Linux, macOS
# and Windows (issue #61); in WebAssembly std uses the same libm, so native
# and WebAssembly results are equal bit for bit. Last-bit differences from
# V8 are accepted (tolerance policy in PORTING.md). sqrt, abs, floor, ceil,
# trunc, mul_add and % are exact in IEEE 754 and stay std's. Tests that only
# compute an expected value within a tolerance may allow this lint.
disallowed-methods = [
  { path = "f64::round", reason = "use js::math::round (JS Math.round rounds halves up)" },
  { path = "f64::min", reason = "use js::math::min (JS NaN and -0 rules)" },
  { path = "f64::max", reason = "use js::math::max (JS NaN and -0 rules)" },
  { path = "slice::sort_unstable", reason = "JS sort is stable: js::array::sort_by" },
  { path = "slice::sort_unstable_by", reason = "JS sort is stable: js::array::sort_by" },
  { path = "f64::sin", reason = "platform libm: use js::math (libm crate, same bits on every platform)" },
  { path = "f64::cos", reason = "platform libm: use js::math (libm crate, same bits on every platform)" },
  { path = "f64::tan", reason = "platform libm: use js::math (libm crate, same bits on every platform)" },
