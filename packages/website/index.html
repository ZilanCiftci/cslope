<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cSlope — Slope Stability Analysis</title>
    <meta
      name="description"
      content="cSlope is open source limit equilibrium software for slope stability analysis: Bishop, Janbu and Morgenstern–Price on circular and non-circular slip surfaces, verified against published solutions."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the theme before the first paint (see theme-provider.tsx).
      try {
        var t = localStorage.getItem("cslope-ui-theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      } catch (e) {}
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="cSlope" />
    <meta property="og:title" content="cSlope — Slope Stability Analysis" />
    <meta
      property="og:description"
      content="Open source limit equilibrium software for slope stability analysis, verified against published solutions."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
